[project]
name = "paynest-a7-infra"
version = "0.1.0"
description = "PayNest A7 AWS CDK (Python) app: NetworkStack, DataStack"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.170,<3",
    "constructs>=10.3,<11",
    "cdk-nag>=2.28,<3",
]

[dependency-groups]
dev = ["pytest>=8", "cfn-lint>=1.0"]

[tool.uv]
package = false
python-preference = "only-managed"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
